<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo title=false %}
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32x32.png' | relative_url }}">
  <script>
    try {
      const saved = sessionStorage.getItem('mode');
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
        ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme =
        matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
</head>
<body>
  {% include site-header.html %}
  <main class="site-body content-page{% if page.url == '/bio/' %} bio-page{% endif %}">
    <div class="page-heading">
      <h1>{% if page.url == '/bio/' %}Witold Więcek{% else %}{{ page.title }}{% endif %}</h1>
      {% if page.url == '/bio/' %}
        <div class="bio-identity">
          <img src="{{ '/assets/witold-wiecek-avatar.jpg' | relative_url }}" alt="" width="88" height="88">
        </div>
      {% endif %}
    </div>
    <div class="page-content">{{ content }}</div>
  </main>
</body>
</html>
