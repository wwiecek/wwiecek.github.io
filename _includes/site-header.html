{% assign header_lang = include.lang | default: site.lang %}
<header class="site-top{% if page.layout == 'post' %} post-site-header{% endif %}">
  <div class="site-top-inner">
    {% if page.layout == 'post' %}
      <div id="topbar-title" class="post-breadcrumb">
        <a href="{{ '/' | relative_url }}">Home</a>
        <span aria-hidden="true">›</span>
        <span>{{ page.title }}</span>
      </div>
    {% else %}
      <strong class="wordmark">Witold Więcek</strong>
    {% endif %}
    <div class="header-actions">
      <nav class="site-nav" aria-label="Primary navigation">
        <span class="nav-group">
          <span class="nav-label">This page:</span>
          <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>HOME</a>
          <a href="{{ '/bio/' | relative_url }}"{% if page.url == '/bio/' %} aria-current="page"{% endif %}>BIO</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>BLOG</a>
        </span>
        <span class="nav-divider" aria-hidden="true">·</span>
        <span class="nav-group">
          <span class="nav-label">Projects:</span>
          <a href="https://witold.xyz/BEAR/" target="_blank" rel="noopener noreferrer">BEAR
            <svg class="external-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 5.5 10.5M12 9v4H3V4h4"/></svg>
          </a>
          <a href="https://witold.xyz/vaccines" target="_blank" rel="noopener noreferrer">VACCINES
            <svg class="external-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 5.5 10.5M12 9v4H3V4h4"/></svg>
          </a>
        </span>
      </nav>
      {% if page.layout == 'post' %}
        <div class="post-header-tools">
          <button type="button" id="sidebar-trigger" class="btn btn-link" aria-label="Open menu">
            <i class="fas fa-bars fa-fw"></i>
          </button>
          <button type="button" id="search-trigger" class="btn btn-link" aria-label="Search">
            <i class="fas fa-search fa-fw"></i>
          </button>
          <search class="align-items-center">
            <i class="fas fa-search fa-fw" aria-hidden="true"></i>
            <input class="form-control" id="search-input" type="search" aria-label="Search"
              autocomplete="off" placeholder="{{ site.data.locales[header_lang].search.hint | capitalize }}...">
          </search>
          <button type="button" class="btn btn-link text-decoration-none" id="search-cancel">
            {{- site.data.locales[header_lang].search.cancel -}}
          </button>
        </div>
      {% endif %}
      <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="theme-mark" aria-hidden="true">◐</span><span class="theme-label">Toggle theme</span>
      </button>
    </div>
  </div>
</header>
